<html xmlns:th="http://thymeleaf.org">
<head>
	<title>Video Player - Personal Music Stream</title>
	<link href='https://fonts.googleapis.com/css?family=Allerta' rel='stylesheet'>
    <style>
		* {
			font-family: 'Allerta', arial, Tahoma, serif;
			box-sizing: border-box;
		}
		body {
			text-align:center;
			color:#fff;
			margin: 0;
			min-height: 100vh;
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
		}
		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5));
		}
		.back-link {
			position: absolute;
			top: 20px;
			left: 20px;
			color: #fff;
			text-decoration: none;
			background: rgba(255,255,255,0.2);
			padding: 10px 20px;
			border-radius: 8px;
		}
		.back-link:hover {
			background: rgba(255,255,255,0.3);
		}
		.player-container {
			background: rgba(255,255,255,0.1);
			padding: 10px;
			border-radius: 12px;
			backdrop-filter: blur(10px);
			max-width: 1800px;
			width: 98%;
		}
		.video-container {
			width: 100%;
			border-radius: 8px;
			overflow: hidden;
			box-shadow: 0 4px 20px rgba(0,0,0,0.5);
		}
		video {
			width: 100%;
			display: block;
		}
		h2 {
			text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
			margin: 20px 0;
			font-size: 1.5em;
		}
		.audio-link {
			color: #fff;
			text-decoration: none;
			background: rgba(255,255,255,0.2);
			padding: 10px 20px;
			border-radius: 8px;
			display: inline-block;
			margin-top: 20px;
		}
		.audio-link:hover {
			background: rgba(255,255,255,0.3);
		}
	</style>
</head>
<body th:style="'background-image: url(' + ${mix.imageUrl} + ');'">
	<div class="container">
		<a th:href="@{/player}" class="back-link">&lt; Back to List</a>
		
		<div class="player-container">
			<div class="video-container">
				<video controls autoplay width="100%">
					<source th:src="@{/file/} + ${#strings.replace(mix.imageFile, '.jpg', '.mp4')}" type="video/mp4">
					Your browser does not support the video tag.
				</video>
			</div>
			<h2 th:text="${mix.name}"></h2>
			<a th:href="@{/audio/} + ${mix.id}" class="audio-link">Audio-Only Version</a>
		</div>
	</div>
</body>
</html>
