<html xmlns:th="http://thymeleaf.org">
<head>
	<title>Personal Music Stream</title>
	<link href='https://fonts.googleapis.com/css?family=Allerta' rel='stylesheet'>
    <style>
		* {
			font-family: 'Allerta', arial, Tahoma, serif;
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}
		body {
			background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
			min-height: 100vh;
			color: #fff;
		}
		.header {
			text-align: center;
			padding: 60px 20px 40px;
		}
		.header h1 {
			font-size: 3em;
			text-shadow: 0 4px 20px rgba(0,0,0,0.5);
			margin-bottom: 10px;
			letter-spacing: 2px;
		}
		.header p {
			font-size: 1.1em;
			opacity: 0.7;
		}
		.container {
			max-width: 1400px;
			margin: 0 auto;
			padding: 20px;
		}
		.mix-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
			gap: 30px;
			padding: 20px;
		}
		.mix-card {
			background: rgba(255,255,255,0.05);
			border-radius: 20px;
			overflow: hidden;
			transition: box-shadow 0.3s;
			backdrop-filter: blur(10px);
			border: 1px solid rgba(255,255,255,0.1);
		}
		.mix-card:hover {
			box-shadow: 0 20px 40px rgba(0,0,0,0.4);
		}
		.mix-image {
			width: 100%;
			height: 250px;
			object-fit: cover;
			display: block;
		}
		.mix-info {
			padding: 25px;
		}
		.mix-name {
			font-size: 1.3em;
			margin-bottom: 20px;
			line-height: 1.4;
		}
		.mix-buttons {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
		}
		.btn {
			display: flex;
			align-items: center;
			justify-content: center;
			text-decoration: none;
			padding: 14px 20px;
			border-radius: 12px;
			font-weight: bold;
			font-size: 0.95em;
			transition: all 0.3s;
			border: none;
			cursor: pointer;
		}
		.btn-video {
			background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
			color: white;
		}
		.btn-video:hover {
			background: linear-gradient(135deg, #f15b4c 0%, #d04e3b 100%);
			box-shadow: 0 8px 20px rgba(231,76,60,0.4);
		}
		.btn-audio {
			background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
			color: white;
		}
		.btn-audio:hover {
			background: linear-gradient(135deg, #4aa3df 0%, #3a91cf 100%);
			box-shadow: 0 8px 20px rgba(52,152,219,0.4);
		}
		.btn svg {
			margin-right: 8px;
		}
		.footer {
			text-align: center;
			padding: 40px;
			opacity: 0.5;
			font-size: 0.9em;
		}
		@media (max-width: 768px) {
			.header h1 {
				font-size: 2em;
			}
			.mix-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<div class="header">
		<h1>Personal Music Stream</h1>
		<p>Stream your favorite mixes in video or audio</p>
	</div>
	
	<div class="container">
		<div class="mix-grid">
			<div class="mix-card" th:each="mix : ${mixes}">
				<img th:src="${mix.imageUrl}" class="mix-image" alt="Album Art"/>
				<div class="mix-info">
					<div class="mix-name" th:text="${mix.name}"></div>
					<div class="mix-buttons">
						<a th:href="@{/video/} + ${mix.id}" class="btn btn-video">
							<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
								<path d="M8 5v14l11-7z"/>
							</svg>
							Watch
						</a>
						<a th:href="@{/audio/} + ${mix.id}" class="btn btn-audio">
							<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
								<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
							</svg>
							Listen
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
